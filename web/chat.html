<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F2F0E8',
                        paperDark: '#E8E5DA',
                        paperCard: '#FAF9F5',
                        ink: '#0E0E0E',
                        charcoal: '#3D3C38',
                        muted: '#6E6C64',
                        acid: '#CEFF1A',
                        signal: '#FF3B00'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; border-radius: 0 !important; }
        body { background: #F2F0E8; color: #0E0E0E; font-family: Inter, sans-serif; }
        .b-box { border: 1px solid #0E0E0E; }
        .b-line-t { border-top: 1px solid #0E0E0E; }
        .b-line-b { border-bottom: 1px solid #0E0E0E; }
        .b-line-l { border-left: 1px solid #0E0E0E; }
        .b-line-r { border-right: 1px solid #0E0E0E; }
        .btn-brutal { background: #0E0E0E; color: #F2F0E8; border: 1px solid #0E0E0E; }
        .btn-brutal:hover { background: #CEFF1A; color: #0E0E0E; }
        .cite-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 6px;
            border: 1px solid #0E0E0E;
            background: #CEFF1A;
            cursor: pointer;
            display: inline-block;
        }
        .cite-pill:hover { background: #0E0E0E; color: #CEFF1A; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #0E0E0E; }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="px-5 sm:px-8 py-4 b-line-b flex items-center justify-between gap-4">
        <a href="/" class="text-[22px] font-black tracking-[-0.05em]">SYNAI</a>
        <div class="flex items-center b-box bg-paper text-[11px] font-mono font-semibold">
            <button type="button" data-lang="en" class="lang px-2.5 py-1 bg-ink text-paper">EN</button>
            <button type="button" data-lang="ru" class="lang px-2.5 py-1 b-line-l">RU</button>
            <button type="button" data-lang="kz" class="lang px-2.5 py-1 b-line-l">KZ</button>
        </div>
    </header>

    <div id="docs" class="px-5 sm:px-8 py-3 b-line-b flex flex-wrap items-center gap-2 font-mono text-[11px]">
        <label class="btn-brutal px-3 py-1.5 cursor-pointer">
            <span id="upload-label">UPLOAD</span>
            <input id="file" type="file" accept=".pdf,.docx,.txt,.xml,.csv,.dxf" multiple class="hidden">
        </label>
        <span id="doc-empty" class="text-muted">No documents yet.</span>
    </div>

    <main id="thread" class="flex-1 overflow-y-auto px-5 sm:px-8 py-6 space-y-4"></main>

    <form id="composer" class="px-5 sm:px-8 py-4 b-line-t flex gap-2">
        <input id="input" type="text" autocomplete="off" class="flex-1 b-box bg-paperCard px-4 py-3 text-[15px] focus:outline-none" placeholder="Ask about the uploaded documents...">
        <button type="submit" class="btn-brutal px-5 py-3 font-mono text-[12px] font-bold">SEND</button>
    </form>

    <script>
        const copy = {
            en: {
                upload: 'UPLOAD',
                empty: 'No documents yet.',
                placeholder: 'Ask about the uploaded documents...',
                send: 'SEND',
                scanning: 'Reading the indexed pages...',
                you: 'YOU',
                none: 'Nothing was found in the selected documents.',
                excerpt: 'Cited excerpt'
            },
            ru: {
                upload: 'ЗАГРУЗИТЬ',
                empty: 'Документов пока нет.',
                placeholder: 'Спросите о загруженных документах...',
                send: 'ОТПРАВИТЬ',
                scanning: 'Читаю проиндексированные страницы...',
                you: 'ВЫ',
                none: 'В выбранных документах это не найдено.',
                excerpt: 'Цитируемый фрагмент'
            },
            kz: {
                upload: 'ЖҮКТЕУ',
                empty: 'Құжат әлі жоқ.',
                placeholder: 'Жүктелген құжаттар туралы сұраңыз...',
                send: 'ЖІБЕРУ',
                scanning: 'Индекстелген беттер оқылуда...',
                you: 'СІЗ',
                none: 'Таңдалған құжаттарда бұл табылмады.',
                excerpt: 'Дәйексөз үзіндісі'
            }
        };

        let lang = localStorage.getItem('synai-lang') || 'en';
        if (!copy[lang]) lang = 'en';
        let documents = [];
        let history = [];
        let busy = false;

        const thread = document.getElementById('thread');
        const input = document.getElementById('input');

        function t(key) { return copy[lang][key]; }
        function esc(value) {
            return String(value || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function apiLang() { return lang === 'kz' ? 'kk' : lang; }

        function paintLang() {
            document.querySelectorAll('.lang').forEach((button) => {
                const on = button.dataset.lang === lang;
                button.className = `lang px-2.5 py-1 ${button.dataset.lang === 'en' ? '' : 'b-line-l'} ${on ? 'bg-ink text-paper' : 'text-ink'}`;
            });
            document.getElementById('upload-label').textContent = t('upload');
            document.getElementById('doc-empty').textContent = t('empty');
            input.placeholder = t('placeholder');
            document.querySelector('#composer button').textContent = t('send');
            localStorage.setItem('synai-lang', lang);
            document.documentElement.lang = lang === 'kz' ? 'kk' : lang;
        }

        function paintDocs() {
            const bar = document.getElementById('docs');
            const empty = document.getElementById('doc-empty');
            bar.querySelectorAll('[data-doc]').forEach((node) => node.remove());
            empty.classList.toggle('hidden', documents.length > 0);
            documents.forEach((doc) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.dataset.doc = doc.id;
                chip.className = `px-2 py-1 b-box ${doc.included === false ? 'text-muted bg-paper' : 'bg-acid'}`;
                chip.textContent = `${doc.filename}${doc.status === 'CONFLICT DETECTED' ? ' !' : ''}`;
                chip.onclick = () => {
                    doc.included = doc.included === false;
                    paintDocs();
                };
                bar.appendChild(chip);
            });
        }

        function addBubble(role, html) {
            const wrap = document.createElement('article');
            wrap.className = role === 'user' ? 'ml-auto max-w-[720px] b-box bg-ink text-paper p-4' : 'max-w-[860px] b-box bg-paperCard p-4';
            wrap.innerHTML = html;
            thread.appendChild(wrap);
            thread.scrollTop = thread.scrollHeight;
            return wrap;
        }

        function clauseFor(data, cite) {
            return (data.clauses || []).find((item) => item.docId === cite.docId && item.clauseKey === cite.clauseKey);
        }

        function renderAnswer(query, data) {
            const message = data.message || {};
            const warning = message.statusType === 'warning';
            const findings = message.findings || [];
            const points = findings.map((finding) => {
                const bits = [esc(finding.text)];
                [finding.citation1, finding.citation2].forEach((cite) => {
                    if (!cite) return;
                    const clause = clauseFor(data, cite);
                    const excerpt = clause ? clause.clause.verbatim : '';
                    bits.push(`<button type="button" class="cite-pill" data-excerpt="${esc(excerpt)}" data-label="${esc(cite.label)}">[${esc(cite.label)}]</button>`);
                });
                if (finding.textCont) bits.push(esc(finding.textCont));
                return `<li class="pl-1">${bits.join(' ')}</li>`;
            }).join('');
            addBubble('assistant', `
                <div class="font-mono text-[10px] font-bold mb-2 ${warning ? 'text-signal' : ''}">${esc(message.status || '')}</div>
                <p class="text-[15px] leading-relaxed mb-3">${esc(message.summary || t('none'))}</p>
                ${points ? `<ol class="list-decimal list-inside space-y-2 text-[14px] leading-relaxed">${points}</ol>` : ''}
                ${message.recommendation ? `<p class="mt-3 pt-3 b-line-t font-mono text-[12px]">${esc(message.recommendation)}</p>` : ''}
                <div class="excerpt hidden mt-3 p-3 b-box bg-acid text-[13px]"></div>
            `);
        }

        thread.addEventListener('click', (event) => {
            const pill = event.target.closest('.cite-pill');
            if (!pill) return;
            const box = pill.closest('article').querySelector('.excerpt');
            box.classList.remove('hidden');
            box.innerHTML = `<div class="font-mono text-[10px] font-bold mb-1">${t('excerpt')} · ${pill.dataset.label}</div>${esc(pill.dataset.excerpt || t('none'))}`;
        });

        async function loadDocs() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();
                documents = data.documents || [];
                paintDocs();
            } catch {
                document.getElementById('doc-empty').textContent = 'API offline';
            }
        }

        document.querySelectorAll('.lang').forEach((button) => {
            button.onclick = () => {
                lang = button.dataset.lang;
                paintLang();
            };
        });

        document.getElementById('file').onchange = async (event) => {
            for (const file of event.target.files) {
                const form = new FormData();
                form.append('file', file);
                await fetch('/api/documents', { method: 'POST', body: form });
            }
            event.target.value = '';
            loadDocs();
        };

        document.getElementById('composer').onsubmit = async (event) => {
            event.preventDefault();
            const query = input.value.trim();
            if (!query || busy) return;
            busy = true;
            input.value = '';
            addBubble('user', `<div class="font-mono text-[10px] mb-1 text-acid">${t('you')}</div><div class="font-semibold">${esc(query)}</div>`);
            const pending = addBubble('assistant', `<div class="font-mono text-xs">${t('scanning')}</div>`);
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query,
                        documentIds: documents.filter((doc) => doc.included !== false).map((doc) => doc.id),
                        language: apiLang(),
                        history
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Query failed');
                pending.remove();
                renderAnswer(query, data);
                history.push({ role: 'user', text: query });
                history.push({ role: 'assistant', text: data.message?.summary || '' });
                history = history.slice(-8);
                if (data.conflicts) {
                    const flagged = new Set(data.conflicts.flatMap((item) => [item.leftDocId, item.rightDocId]));
                    documents.forEach((doc) => {
                        if (flagged.has(doc.id)) doc.status = 'CONFLICT DETECTED';
                    });
                    paintDocs();
                }
            } catch (error) {
                pending.innerHTML = `<div class="font-mono text-xs text-signal">${esc(error.message)}</div>`;
            } finally {
                busy = false;
                input.focus();
            }
        };

        paintLang();
        loadDocs();
        input.focus();
    </script>
</body>
</html>
